[profile.default]
fs_permissions = [{ access = "read-write", path = "./" }]
optimizer = true
optimizer_runs = 200

# A list of solidity error codes to ignore.
# 3860 = init-code-size
ignored_error_codes = [3860]

[rpc_endpoints]
# The RPC URLs are modified versions of the default for testing initialization.
mainnet = "${ETH_RPC_URL}"
base-mainnet = "${BASE_RPC_URL}"
polygon-mainnet = "${POLYGON_RPC_URL}"
needs_undefined_env_var = "${ETH_RPC_URL}"

[lint]
lint_on_build = false
